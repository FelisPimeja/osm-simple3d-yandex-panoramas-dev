<!doctype html><html lang="ru"><meta charset="utf-8"><title>Yandex Panoramas DEV</title>
<style>body{font:14px sans-serif;margin:16px}input{width:120px}#panel{position:relative;width:min(100%,1000px);height:600px;margin-top:12px}button{cursor:pointer}#cone{margin:8px 0}</style>
<h1>Yandex Panoramas DEV</h1><p>Тяните изображение мышью; колесо меняет масштаб. Координаты: долгота, широта. Поиск значков шаров выполняется на масштабе 14.</p>
<form><input id="lon" value="37.6208" aria-label="Долгота"><input id="lat" value="55.7539" aria-label="Широта"><button>Открыть</button></form><div id="toggles" style="margin-top:8px"></div><div id="cone"></div><div id="panel"></div>
<script type="module">
import {activate} from './plugin.js';
let click;
const body=document.querySelector('#panel');
const cleanup=activate({lang:'ru',addPhotoToggle(id,label,title,change){const box=document.createElement('label');box.style.marginRight='12px';const input=document.createElement('input');input.type='checkbox';input.style.width='auto';input.checked=id==='panoramas-dev';input.onchange=()=>change(input.checked);box.append(input,document.createTextNode(label));document.querySelector('#toggles').append(box);change(input.checked);},onMapClick(cb){click=cb;},openPanel(){return {body,setTitle(title){document.querySelector('h1').textContent=title;},close(){body.replaceChildren();},onClose(){}};},setViewCone(v){document.querySelector('#cone').textContent=v?`Азимут ${v.azimuth.toFixed(1)}°, поле зрения ${v.fov.toFixed(1)}°, позиция ${v.lngLat.join(', ')}`:'';},markUsed(){}});
document.querySelector('form').onsubmit=e=>{e.preventDefault();const ll=[Number(document.querySelector('#lon').value),Number(document.querySelector('#lat').value)];if(ll.every(Number.isFinite))click(ll,{onObject:false,zoom:14});};
window.addEventListener('pagehide',cleanup);
document.querySelector('form').requestSubmit();
</script></html>
